<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoGuard</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand">
          <img class="brand-logo" src="icons/icon48.png" alt="" width="28" height="28" />
          <h1>RepoGuard</h1>
        </div>
        <span class="badge" id="badge" data-kind="other">Checking…</span>
      </header>

      <p class="status" id="status">Checking active tab…</p>
      <p class="detail" id="detail"></p>

      <section class="select-section" id="selectSection" hidden>
        <div class="section-bar">
          <h2 class="section-title">Select paths</h2>
          <div class="section-actions">
            <button type="button" class="secondary-btn" id="refreshListBtn">
              Refresh
            </button>
            <button type="button" class="secondary-btn" id="selectAllBtn">
              Select all
            </button>
            <button type="button" class="secondary-btn" id="clearSelBtn">
              Clear
            </button>
          </div>
        </div>
        <p class="select-meta" id="selectMeta">0 selected</p>
        <ul class="select-list" id="selectList"></ul>
        <p class="select-empty" id="selectEmpty" hidden>
          No file/folder links found on this page. Open a repo code browser and click Refresh.
        </p>
      </section>

      <button type="button" class="scan-btn" id="scanBtn" disabled>
        Scan selection
      </button>

      <section class="results" id="results" hidden>
        <div class="results-toolbar">
          <h2 class="section-title">Findings</h2>
          <button type="button" class="secondary-btn" id="exportBtn" disabled>
            Export findings
          </button>
        </div>
        <div id="notesPark" class="notes-park">
          <article class="notes" id="notes" hidden>
            <h2 class="notes-title" id="notesTitle"></h2>
            <p class="notes-meta" id="notesMeta"></p>
            <button type="button" class="notes-heading notes-loc-toggle" id="notesLocToggle">
              Location
              <span class="notes-loc-chevron" id="notesLocChevron">▶</span>
            </button>
            <p class="notes-body notes-loc-summary" id="notesLocation"></p>
            <ul class="notes-loc-list" id="notesLocList" hidden></ul>
            <h3 class="notes-heading">Why this is an issue</h3>
            <p class="notes-body" id="notesWhy"></p>
            <h3 class="notes-heading">How to fix it</h3>
            <p class="notes-body" id="notesFix"></p>
            <button type="button" class="open-btn" id="openBtn">
              Open on GitHub
            </button>
          </article>
        </div>
        <div class="severity-groups" id="severityGroups"></div>
      </section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
